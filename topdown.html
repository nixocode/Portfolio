<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <!-- Content Security Policy. Safe to be strict here: the build emits ZERO
       inline scripts, so `script-src 'self'` needs no unsafe-inline. Style
       needs unsafe-inline because the 3D layer writes inline style attributes
       (transform/opacity) every frame. frame-src lists ONLY the game
       deployments used by the hover live-preview — add a domain here if you
       add another embeddable project. -->
  <link rel="icon" type="image/svg+xml" href="/Portfolio/favicon.svg" />
  <link rel="apple-touch-icon" href="/Portfolio/apple-touch-icon.png" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.github.com; frame-src https://global-strike-v0-1.vercel.app https://global-strike-game.vercel.app https://vietnam-65.vercel.app; object-src 'none'; base-uri 'self'; form-action 'none'" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description"
    content="Top-down view — the whole project network at once. Nicolas Pertierra's portfolio as a navigable 3D node graph." />
  <meta name="theme-color" content="#050608" />
  <meta name="robots" content="noindex" />
  <title>Top Down View — Nicolas Pertierra</title>
</head>

<body class="topdown in-graph">

  <!-- Big, always-visible way home -->
  <a class="td-back" href="/Portfolio/" title="Back to the main site">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor"
         stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/>
    </svg>
    <span>Back to site</span>
  </a>

  <!-- Fixed nav: lane chips -->
  <header class="top-nav visible" id="top-nav">
    <nav class="nav-chips" id="nav-chips" aria-label="Choose a discipline"></nav>
  </header>

  <div class="td-hint" id="td-hint">
    Scroll to fly through the network<span class="td-hint-keys"> · ← → to switch discipline</span> · tap a node
  </div>

  <!-- The 3D node metaverse: scroll flies the camera down through the network -->
  <section id="cinema" class="cinema">
    <div class="cine-sticky" id="cine-sticky">
      <canvas id="threads" class="cine-canvas" aria-hidden="true"></canvas>
      <div class="cine-overlay" id="cine-overlay" aria-label="Projects by discipline">
        <button type="button" id="cine-source" class="ov-anchor" title="Back to overview">
          <span class="anchor-dot"></span><span class="anchor-label">2026 · Projects</span>
        </button>
        <button type="button" id="cine-sink" class="ov-anchor" title="Back to overview">
          <span class="anchor-dot"></span>
        </button>
      </div>
    </div>
  </section>

  <!-- Click-to-swap category arrows (also: ← → / A D / swipe) -->
  <button type="button" class="cine-arrow cine-arrow-left" id="arrow-prev" aria-label="Previous category">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
  </button>
  <button type="button" class="cine-arrow cine-arrow-right" id="arrow-next" aria-label="Next category">
    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="9 18 15 12 9 6"/></svg>
  </button>

  <script type="module" src="/src/topdown.js"></script>
</body>

</html>
