<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Nico Pertierra — minimal NP monogram.
       Deliberately just the two letters: at 16px (the size that actually
       matters for a tab) any ring or orbit detail collapses into noise.
       The P's counter is a true circle — a quiet nod to the site's node graph.
       Vector, monochrome, ~1 kB, sharp at every size. -->
  <g fill="#ffffff" fill-rule="evenodd">
    <!-- N -->
    <path d="M2.6 26V6H6l4.6 12.6V6H14v20h-3.4L6 13.4V26z"/>
    <!-- P with a circular counter -->
    <path d="M17.4 6h6.7a6.3 6.3 0 0 1 0 12.6h-3.3V26h-3.4zm3.4 3.3v6h3.3a3 3 0 0 0 0-6z"/>
  </g>
</svg>
